<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#082F49" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4">
        <animate attributeName="stop-color" values="#06B6D4;#3B82F6;#10B981;#06B6D4" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#3B82F6">
        <animate attributeName="stop-color" values="#3B82F6;#10B981;#06B6D4;#3B82F6" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#06B6D4;#3B82F6;#10B981" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 50px;
      fill: #F8FAFC;
      letter-spacing: -1px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 500;
      font-size: 21px;
      fill: #94A3B8;
      letter-spacing: 0.5px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 700;
      font-size: 13px;
      fill: #E0F2FE;
      letter-spacing: 1px;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#38BDF8" stroke-width="1">
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
    <line x1="1100" y1="0" x2="1100" y2="400" />
  </g>

  <!-- Ambient Glowing Orbs -->
  <circle cx="200" cy="120" r="140" fill="#0284C7" opacity="0.18" filter="url(#glow)">
    <animate attributeName="r" values="120;160;120" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.12;0.25;0.12" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="1020" cy="280" r="160" fill="#10B981" opacity="0.15" filter="url(#glow)">
    <animate attributeName="r" values="140;180;140" dur="7s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.10;0.22;0.10" dur="7s" repeatCount="indefinite" />
  </circle>

  <!-- Animated ECG / Pulse Line -->
  <path d="M 0 320 Q 200 320 350 320 L 380 320 L 395 290 L 410 350 L 425 260 L 440 340 L 455 315 L 470 320 L 750 320 L 765 295 L 780 345 L 795 270 L 810 335 L 825 315 L 840 320 L 1200 320" 
        fill="none" stroke="url(#accentGrad)" stroke-width="3.5" opacity="0.8" filter="url(#softGlow)">
    <animate attributeName="stroke-dasharray" values="0,1500;1500,0" dur="4s" repeatCount="indefinite" />
  </path>

  <!-- Left Medical Shield / Cross Graphic -->
  <g transform="translate(100, 110)">
    <circle cx="90" cy="90" r="78" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="12 8" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0 90 90" to="360 90 90" dur="20s" repeatCount="indefinite" />
    </circle>
    
    <path d="M 90 20 L 150 45 C 150 110 120 145 90 160 C 60 145 30 110 30 45 Z" fill="#0F172A" stroke="url(#accentGrad)" stroke-width="3.5" filter="url(#softGlow)">
      <animate attributeName="stroke-width" values="3;4.5;3" dur="3s" repeatCount="indefinite" />
    </path>

    <g transform="translate(90, 88)">
      <rect x="-10" y="-32" width="20" height="64" rx="5" fill="url(#accentGrad)">
        <animate attributeName="opacity" values="0.85;1;0.85" dur="2s" repeatCount="indefinite" />
      </rect>
      <rect x="-32" y="-10" width="64" height="20" rx="5" fill="url(#accentGrad)">
        <animate attributeName="opacity" values="0.85;1;0.85" dur="2s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>

  <!-- Center Text Content -->
  <g transform="translate(320, 130)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="310" height="28" rx="14" fill="#0369A1" fill-opacity="0.35" stroke="#38BDF8" stroke-width="1.2" />
    <circle cx="16" cy="14" r="5" fill="#38BDF8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="19" class="badge-text">ISO 13485 • FDA QMSR • IEC 62304</text>

    <!-- Main Title -->
    <text x="0" y="80" class="title">Awesome Medical Device QMS</text>
    
    <!-- Gradient Bar Underline -->
    <rect x="0" y="98" width="580" height="4" rx="2" fill="url(#accentGrad)" />

    <!-- Subtitle -->
    <text x="0" y="140" class="subtitle">Curated eQMS Software, Open-Source Baselines &amp; Compliance Tools</text>
  </g>

  <!-- Top Right Regulatory Tags -->
  <g transform="translate(930, 80)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="180" height="34" rx="8" fill="#1E293B" stroke="#0EA5E9" stroke-width="1" opacity="0.9"/>
      <text x="90" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#38BDF8">🏥 21 CFR Part 820 / 11</text>
    </g>
    <g transform="translate(0, 48)">
      <rect x="0" y="0" width="180" height="34" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1" opacity="0.9"/>
      <text x="90" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#34D399">🇪🇺 EU MDR / IVDR</text>
    </g>
    <g transform="translate(0, 96)">
      <rect x="0" y="0" width="180" height="34" rx="8" fill="#1E293B" stroke="#6366F1" stroke-width="1" opacity="0.9"/>
      <text x="90" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#818CF8">🛡️ ISO 14971 Risk</text>
    </g>
    <g transform="translate(0, 144)">
      <rect x="0" y="0" width="180" height="34" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1" opacity="0.9"/>
      <text x="90" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#FBBF24">💻 SaMD &amp; AIaMD</text>
    </g>
  </g>
</svg>
